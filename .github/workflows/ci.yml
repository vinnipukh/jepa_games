name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Validate the fixture datasets with the CLI
        run: |
          cargo run --locked -p water_sort_cli -- validate water_sort_cli/tests/fixtures/datasets/uniform_c5k4e2 --regen-rate 1
          cargo run --locked -p water_sort_cli -- validate water_sort_cli/tests/fixtures/datasets/turan_pour_walk_distributed_c4k3e1 --regen-rate 1

  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install maturin -r pyproject.toml --extra test
      - run: uv run --no-project maturin develop --release --locked
      - run: uv run --no-project python -m pytest -v

  wasm:
    name: wasm (build + wasm-bindgen-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml and the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version from Cargo.lock
        id: wb
        run: echo "version=$(scripts/wasm-bindgen-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - run: cargo clippy -p water_sort_web --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - name: Golden vectors and rollouts on wasm32 (wasm-bindgen-test, Node)
        run: cargo test --release --locked -p water_sort_web --target wasm32-unknown-unknown
      - name: Build the wasm module and JS bindings
        run: web/build.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - name: Typecheck and build the web app
        working-directory: web/app
        run: |
          npm ci
          npm run build

  heavy-tests:
    name: heavy tests (release, ignored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace --locked -- --ignored

  setup-script:
    name: cloud setup script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: scripts/setup-cloud.sh
