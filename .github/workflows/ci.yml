name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Validate the fixture datasets with the CLI
        run: |
          cargo run --locked -p water_sort_cli -- validate water_sort_cli/tests/fixtures/datasets/uniform_c5k4e2 --regen-rate 1
          cargo run --locked -p water_sort_cli -- validate water_sort_cli/tests/fixtures/datasets/turan_pour_walk_distributed_c4k3e1 --regen-rate 1

  heavy-tests:
    name: heavy tests (release, ignored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace --locked -- --ignored

  setup-script:
    name: cloud setup script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: scripts/setup-cloud.sh
