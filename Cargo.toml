[workspace]
resolver = "3"
members = [
    "water_sort_core",
    "uniform_water_sort",
    "turan_water_sort",
    "water_sort_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
water_sort_core = { path = "water_sort_core" }
uniform_water_sort = { path = "uniform_water_sort" }
turan_water_sort = { path = "turan_water_sort" }

rand_core = "0.10"
rand_chacha = "0.10"
getrandom = "0.4"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
proptest = "1"
rustc-hash = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
