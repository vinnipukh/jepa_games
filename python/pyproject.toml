[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "jepa_water_sort"
description = "Water Sort puzzles (Rust core via PyO3), a Gymnasium environment, a trajectory logger and a JEPA world model"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "pyarrow>=15",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]
# The JEPA package (Phase 7). For a CUDA build of torch: `uv pip install ... --torch-backend auto`.
jepa = ["torch>=2.4", "tensorboard>=2.16"]

[tool.maturin]
module-name = "jepa_water_sort._native"
python-source = "."
python-packages = ["jepa_water_sort", "jepa"]
features = []
locked = true

[tool.pytest.ini_options]
testpaths = ["tests"]
